<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
{%- include head.html -%}
</head>
<body>

<a class="skip-link" href="#main">Skip to main content</a>

{%- include header.html -%}

<main id="main">
{{ content }}
</main>

{%- include footer.html -%}

<script src="{{ '/assets/js/reduced-motion.js' | relative_url }}" defer></script>

</body>
</html>
