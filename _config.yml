title: "GLOW"
tagline: "Gravitational Lensing of Waves"
description: >-
  GLOW is an ERC Consolidator Grant project developing the theory, methods and
  software to identify and interpret wave-optics lensing of gravitational waves
  and fast radio bursts.

# The site is built to be served at the root of its own domain, so baseurl stays
# empty and every internal link is a plain absolute path.
#
# glow-astro.org, decided 2026-08-27. One namespace for everything: the code,
# this repository and the domain.
#
# glow-erc.org was acquired during the naming back and forth and will redirect
# here, but the owner may not renew it past 2027-08-19. It is temporary by
# intention -- it must never appear here, never be a canonical, and nothing may
# assume it resolves.
#
# The CNAME file beside this one is the other half: GitHub Pages reads it to
# claim the domain. It is excluded from the review build in _config.review.yml,
# because deploy_review.sh refuses to ship anything containing the production
# domain and CNAME is nothing but the production domain.
url: "https://glow-astro.org"
baseurl: ""
lang: en

# The ERC project. Note the capitalisation: GLOW is this project, GLoW (lowercase
# "o") is the software. The distinction is load-bearing -- see _data/software.yml.
project:
  acronym: "GLOW"
  title: "Gravitational Lensing of Waves"
  grant_number: "101230608"
  call: "ERC-2025-COG"
  scheme: "European Research Council Consolidator Grant"
  duration: "60 months"
  start: "2026"
  end: "2031"
  cordis: "https://cordis.europa.eu/project/id/101230608"

pi:
  name: "Miguel Zumalacárregui"
  email: "miguel.zumalacarregui@csic.es"
  orcid: "0000-0002-9943-6490"
  orcid_url: "https://orcid.org/0000-0002-9943-6490"
  inspire: "https://inspirehep.net/authors/1113379"
  site: "https://miguelzuma.github.io/"
  github: "https://github.com/miguelzuma"

# Host institution of the grant. Confirmed 2026-08-19 against the public CORDIS
# record for 101230608, which names CSIC as the host beneficiary -- consistent
# with the DoA cover page. The AEI, which the DoA methodology describes the team
# integrating into, is carried below as `partner` rather than as the host. If the
# host-institution change in the ERC folder is a pending amendment rather than a
# completed one, CORDIS would not yet show it and this needs revisiting.
# Every page that names an affiliation reads from here.
host:
  name: "Consejo Superior de Investigaciones Científicas (CSIC)"
  short: "CSIC"
  url: "https://www.csic.es/"
  institute: "Instituto de Física Teórica IFT-UAM/CSIC"
  institute_short: "IFT Madrid"
  institute_url: "https://www.ift.uam-csic.es/"
  address: "C/ Nicolás Cabrera 13-15, Campus de Cantoblanco, 28049 Madrid, Spain"

partner:
  name: "Max Planck Institute for Gravitational Physics (Albert Einstein Institute)"
  short: "AEI Potsdam"
  url: "https://www.aei.mpg.de/"
  address: "Am Mühlenberg 1, 14476 Potsdam, Germany"

# Horizon Europe communication obligations. The emblem must appear with the
# words "Funded by the European Union"; the disclaimer must accompany it.
# The file below is the white wordmark variant, which is what the emblem rules
# require on a dark background -- the official "dark" file ships a navy
# wordmark that is illegible here.
eu:
  emblem: "/imgs/erc_eu_funding_dark.png"
  emblem_alt: "Funded by the European Union — European Research Council"
  statement: >-
    Funded by the European Union. Views and opinions expressed are however those
    of the author(s) only and do not necessarily reflect those of the European
    Union or the European Research Council Executive Agency. Neither the European
    Union nor the granting authority can be held responsible for them.

# The card WhatsApp, Slack, Signal, Mastodon and the rest render beside a
# shared link. It must be OPAQUE: the logo PNGs have transparent backgrounds,
# and a chat app that composites them on white loses the white wordmark
# entirely, leaving a sun and a red circle with no name attached. That is what
# was shipping until 2026-09-04.
#
# 1200x630 is the size every platform crops from, and og-card-v1.png is the
# extended logo centred on the site background (#0a0c11). The -v1 suffix is the
# cache rule in section 3 of docs/SITE_CONVENTIONS.md: these URLs are cached
# hard and for a long time by every chat service that has ever scraped them, so
# a corrected card gets a new name rather than a new body.
og_image: "/imgs/og-card-v1.png"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

sass:
  style: compressed

# Visit counting. The value is the GoatCounter site code, so `glow-astro` here
# means the account at glow-astro.goatcounter.com and the endpoint
# glow-astro.goatcounter.com/count. Empty disables it outright: no script is
# emitted at all, which is what _includes/analytics.html checks.
#
# The review host never counts, whatever this says. See the include.
analytics:
  goatcounter: "glow-astro"

plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
  - tools
  - docs
  # The prose-review document, edited in LibreOffice and left in the tree while
  # it is being worked on. It is the whole site's text in one file: built into
  # _site it would be a public page nobody linked but a crawler would find.
  # The pattern is extension-less on purpose -- the generated .odt sits here too.
  - "glow-site-text*"
  - ".~lock*"
