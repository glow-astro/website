# References cited on science.html.
#
# Borrowed from the grant proposal's bibliography (Part B1), which is where
# these claims were argued in the first place -- so the citations here support
# the same statements they supported there, rather than being attached after
# the fact.
#
# THIS FILE IS A POOL, NOT A NUMBERING. Several pages cite from it, and each
# declares in its own `refs:` front matter which entries it cites and in what
# order; that order is the numbering on that page. So a work can be [3] on the
# science case and [1] on a topic page, and every page numbers from 1 with no
# gaps. Order here is only for finding things: keep it grouped as it is.
#
# Adding an entry is therefore free -- nothing renumbers. Deleting one breaks
# every page that cites it, which the verification pass catches.
#
# Titles are the canonical ones from the arXiv API, not the proposal's numeric
# style, and every `url` was checked to resolve before being committed.
#
# Schema
#   id       slug used by {% include cite.html key="..." %}
#   authors  as cited; "et al." past three
#   title    optional -- the proposal's style omits titles for some entries and
#            a guessed title is worse than none
#   where    journal, volume, year; or the kind of document
#   url      optional; arXiv abstract page, DOI, or the page itself

