# Science topics. Drives the source-lens-observer diagram on science.html, the
# topic bar, and the header of each topic page, so the three can never describe
# a topic differently.
#
# The split this file sits on: a topic page explains the physics -- what the
# phenomenon is and what it can measure. The work-packages page says what this
# grant will build and who leads it. Cross-link; do not repeat.
#
# The list is FLAT, and the topic bar stays flat. An earlier version grouped
# these under "wave-optics lensing" and "fundamental physics", which was wrong:
# microlensing is both a wave-optics problem and a dark-matter probe, and the
# wave-optics topic covers plasma lensing and dispersion as well as diffraction.
# That grouping was a taxonomy, and the topics resist being sorted into kinds.
#
# The diagram is not a taxonomy, which is why it may group where the bar may
# not. Its top row is the light path -- a card sits over the source, the lens
# or the observer, because that is where the phenomenon acts -- and its bottom
# row is what the project builds in order to measure any of it. A position on a
# journey is not a category, and cards placed near what they refer to show the
# overlap instead of denying it: microlensing and dark matter both act at the
# lens, and both sit there.
#
# Order in THIS FILE is a reading order -- the topic bar and the previous/next
# buttons follow it, and it builds: the phenomenon, the lenses, the analysis,
# then what they measure. It is deliberately NOT the diagram order. The diagram
# leads with what the project measures, because top-left is the strongest
# position on a figure and the questions belong there; the bar leads with wave
# optics, because the other five lean on it and topic 1 should not be the most
# specialized page. `row` and `column` place the cards, so the two orders are
# free to differ.
#
# Schema
#   id       slug; the page is <id>.html and, if `media` is present, the video
#            is media/<id>.{webm,mp4} plus media/<id>_still.png
#   title    page title and diagram card title
#   short    label in the topic bar, where there is no room for the full title
#   row      `top` or `bottom` -- which band of the diagram the card sits in
#   column   1-3, left to right. With `row` this is the cell in the 3x2 grid,
#            and no two topics may claim the same cell: the rows are absolutely
#            positioned, so a collision silently stacks two cards on a busy
#            image where the eye will not catch it.
#   tint     suffix of the .skymap-card tint class -- the card's border and
#            title colour. See the tint- rules in assets/css/main.css.
#   card     ~15 words for the diagram card. Deliberately shorter than `blurb`:
#            it is set over a photograph on a translucent plate, and two
#            sentences there are unreadable.
#   blurb    one or two sentences; the topic's own summary, used in prose
#   wps      work-package tasks this topic feeds
#   papers   arXiv ids from publications.yml, for the "read more" line
#   media    OPTIONAL -- the page's OPENING figure, where it has one. Set
#            `static: true` for a plot instead of an animation; the file is
#            then media/<file>.png and there is no poster. `file` names the
#            render, defaulting to the topic id; set it when the animation is
#            not specific to this topic, so the filename says what the video
#            shows. Never reuse a name for different content -- returning
#            visitors get the old file out of cache. `width`/`height` are
#            the render's real pixel size, read off the poster frame: they are
#            not all the same shape, so they reserve the right space and stop
#            the caption jumping when the video loads. `alt` describes it for
#            someone who cannot see it; `caption` says what it shows. `source`
#            is the repo and family the render came from, so it can be
#            regenerated -- see ~/code/application_plots/ANIMATIONS.md.

# ---- Bottom row: what GLOW builds -----------------------------------------

- id: wave-optics
  title: "Wave optics"
  short: "Wave optics"
  row: bottom
  column: 1
  tint: wave
  card: >-
    Diffraction, interference and plasma lensing: the theory, and the
    algorithms to compute it.
  blurb: >-
    When the wavelength is comparable to the gravitational radius of the lens,
    geometric optics fails. Diffraction, interference, plasma lensing and dispersion are all the
    same statement: the lens writes a frequency-dependent signature into the
    wave.
  wps: ["WP1-A", "WP1-B"]
  papers: ["2606.17765"]
  # The opener is ordinary optics, not the gravitational-wave case: a bench
  # experiment anyone can picture, making the same statement the rest of the
  # page makes about lenses. The GW sweep follows in the first section.
  media:
    file: diffraction-size
    width: 1560
    height: 780
    alt: >-
      Animation: light of a single colour passes through a rectangular opening
      that grows, shrinks, and then stretches. The pattern on the screen behind
      it moves the opposite way — tightening as the opening widens, and
      stretching across as the opening stretches down.
    caption: >-
      Diffraction patterns carry information about the objects they probe. Here
      simulated monochromatic light is shot through a single opening whose size
      and shape change (top right). The pattern it casts — in full at left, and
      as a cut through the middle at bottom right — follows the size of that
      opening: widen it and the pattern tightens, stretch it one way and the
      pattern stretches the other.
    source: "application_plots, family diffraction_size_glow"

- id: microlensing
  title: "Microlensing"
  short: "Microlensing"
  row: bottom
  column: 2
  tint: strong
  card: >-
    Stars and remnants in the lensing galaxy, treated collectively.
  blurb: >-
    A lens is rarely one object. Populations of compact objects — stars,
    remnants, or dark matter — contribute collectively to the diffraction, and
    what a signal carries is the statistics of the population rather than any
    single lens.
  wps: ["WP1-A", "WP2-A", "WP3-A"]
  papers: ["2606.17765", "2512.17631"]
  # The setup before any of its parts: the sweep further down varies a
  # parameter of a geometry the reader has not been shown yet.
  #
  # The _web_ variant, not _talk_: its type is sized off main.css rather than
  # off a slide, so the panel titles read as headings next to the site's own
  # rather than shouting over them -- 21px, the site's own h3.
  # One thing it cannot fix -- the labels inside the left panel are baked into
  # a raster diagram with no vector source, so they stay serif.
  media:
    file: microlensing-chain
    static: true
    width: 2000
    height: 608
    alt: >-
      Three panels. Left: a galaxy splits a source into two images with a time
      delay between them. Centre: a zoom into one image showing a pc-scale
      network of overlapping microlensing critical curves, with orange marking
      high magnification. Right: the two images' waveforms, one distorted
      relative to the other.
    caption: >-
      From strong lensing to waveform distortions. A galaxy splits the source
      into two macroimages separated by a time delay. One of those images lands
      on a field of stars, which forms a network of critical curves on very
      small scales — the middle panel. Each image arrives carrying a different
      wave-optics distortion, shown in the right panel.
    source: "application_plots, plots/microlensing/microlensing_master_3_web_dark"

- id: data-analysis
  title: "Data analysis"
  short: "Data analysis"
  row: bottom
  column: 3
  tint: methods
  card: >-
    Waveform models, population analyses, and simulation-based inference.
  blurb: >-
    Lensing predictions have to become searches over real data — effective
    models for stochastic lenses, population analyses, and inference fast enough
    to keep up with the detectors.
  wps: ["WP2-A", "WP2-B"]
  papers: ["2512.17631", "2606.17765"]
  media:
    width: 1560
    height: 520
    alt: >-
      Animation: samples drawn from the posterior of a lensed gravitational-wave
      analysis, each one a lens configuration, with the predicted response
      converging on the best-fitting model as the samples improve.
    caption: >-
      Parameter estimation compares the data with the predictions of a model
      across parameter space. The exploration is shown here for a two-parameter
      example: on the left, each point is a value of the lens mass and the
      external shear; on the right, the time-domain response that pair predicts,
      bouncing around the best fit. The upper panel shows the total response and
      the lower one the wave-optics contribution. The samples are ordered by
      likelihood, so they close in on the best fit as the animation runs.
    source: "GW231123_independent_analysis, family sampling"

# ---- Top row: what a lensed wave measures, along the light path ------------

- id: sources
  title: "Distant and strong-field sources"
  short: "Sources"
  row: top
  column: 1
  tint: source
  card: >-
    Magnified black holes at z > 3, and sources near supermassive black
    holes.
  blurb: >-
    Gravitational magnification turns gravitational lenses into telescopes,
    enabling the observation of even the most distant sources. It can also
    reveal the association of a signal with a supermassive black hole.
  wps: ["WP2-A"]
  papers: ["2512.17631"]
  # No animation exists for a magnified high-redshift source, but this plot
  # makes the page's whole argument at once, so the page opens on it.
  media:
    file: lensed-population
    static: true
    width: 1800
    height: 1125
    alt: >-
      Source mass against redshift. Grey points mark detected black-hole
      mergers, all below a curve labelled instrument horizon. Two green regions
      sit above that curve: lensed neutron stars, annotated multimessenger, and
      lensed black holes, annotated as tracking star formation. A dashed
      magnification track runs from a marker at low redshift up through the pink
      contour for GW231123 and on into the lensed black-hole region.
    caption: >-
      Lensing takes a detector beyond its nominal capabilities. The grey curve
      shows the “detector horizon”, the maximum distance at which sources are
      observable. Every merger detected so far (grey points show median values)
      sits below it. The green regions show where lensed black holes and neutron
      stars (magnification > 2) are expected. Black holes are typically observed
      around and beyond the detector horizon, assuming the merger history
      follows star formation. Neutron stars are expected well beyond the
      detector horizon, subject to large magnification factors and wave-optics
      distortions, and with observable electromagnetic counterparts. GW231123 in
      the standard analysis is highlighted (pink diamond), along with its true
      mass/source under gravitational magnification (dashed line) and the 90%
      confidence regions inferred from the lensed analysis.
    cite: smith-rates
    source: "application_plots, plots/gw231123/population_lensing"

- id: dark-matter
  title: "Dark matter & small scales"
  short: "Dark matter"
  row: top
  column: 2
  tint: lens
  card: >-
    Halos and compact objects below 10<sup>6</sup> M<sub>☉</sub>, on scales
    no image can resolve.
  blurb: >-
    Diffraction is sensitive to structure on scales no image can resolve, which
    makes coherent sources one of the few probes of dark matter below the size
    of a galaxy.
  wps: ["WP3-A"]
  papers: ["2607.11887"]
  # Deliberately the simplest statement on the page, not the project's own
  # result: what a diffraction pattern can tell you about the thing that made
  # it. The LISA realization follows further down, once that is established.
  media:
    file: diffraction-shape
    width: 1560
    height: 780
    alt: >-
      Animation: an opening morphs through a circle, triangle, square, pentagon
      and hexagon at constant area, and the pattern of light behind it grows a
      matching set of spikes -- six for the triangle, four for the square, ten
      for the pentagon.
    caption: >-
      A diffraction pattern carries the shape of what made it, not just its
      size. An opening morphs through a circle, triangle, square, pentagon and
      hexagon at fixed area, and the pattern grows spikes to match -- n of them
      for an even-sided polygon and 2n for an odd-sided one, because opposite
      parallel edges radiate into the same line. That sensitivity is what lets a
      diffracted gravitational wave say whether a lens was a point mass or an
      extended halo, rather than only how heavy it was.
    source: "application_plots, family diffraction_shape_glow"

- id: testing-gravity
  title: "Testing gravity and dark energy"
  short: "Gravity & dark energy"
  row: top
  column: 3
  tint: grav
  card: >-
    Distortions on propagating waves that can't be produced in Einstein's
    theory.
  blurb: >-
    A lensed gravitational wave is a controlled experiment in how gravity
    propagates. Theories that modify it predict distortions no lens made of
    ordinary matter can produce.
  wps: ["WP3-B"]
  papers: []
  media:
    width: 1560
    height: 975
    alt: >-
      Animation: a screened lens sweeps across a gravitational-wave signal drawn
      as a snapshot in space; below, the two polarizations drift apart in time,
      and the detector would record a waveform scrambled relative to the
      prediction of general relativity.
    caption: >-
      Gravitational-wave birefringence. Top: a Vainshtein-screened lens crossing
      the signal, which is drawn where it is in space — the low-frequency
      inspiral leading, the merger at the packet and the ringdown trailing. The
      lens gives the two polarizations slightly different speeds, so they pull
      apart, here by 50 ms. Below: what a detector records. The delay is short
      enough that the two copies overlap, so the waveform is scrambled rather
      than repeated — and no electromagnetic counterpart is needed to see it.
    source: "gw_birefringence, family birefringence_scramble"
