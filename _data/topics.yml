# Science topics. Drives the source-lens-observer diagram on science.html, the
# topic bar, and the header of each topic page, so the three can never describe
# a topic differently.
#
# The split this file sits on: a topic page explains the physics -- what the
# phenomenon is and what it can measure. The work-packages page says what this
# grant will build and who leads it. Cross-link; do not repeat.
#
# The list is FLAT, and the topic bar stays flat. An earlier version grouped
# these under "wave-optics lensing" and "fundamental physics", which was wrong:
# microlensing is both a wave-optics problem and a dark-matter probe, and the
# wave-optics topic covers plasma lensing and dispersion as well as diffraction.
# That grouping was a taxonomy, and the topics resist being sorted into kinds.
#
# The diagram is not a taxonomy, which is why it may group where the bar may
# not. Its bottom row is the light path -- a card sits over the source, the lens
# or the observer, because that is where the phenomenon acts -- and its top row
# is what the project builds in order to measure any of it. A position on a
# journey is not a category, and cards placed near what they refer to show the
# overlap instead of denying it: microlensing and dark matter both act at the
# lens, and both sit there.
#
# Order is a reading order, and the previous/next buttons follow it. It is also
# the diagram order: the three top-row cards, then the three bottom-row ones.
#
# Schema
#   id       slug; the page is <id>.html and, if `media` is present, the video
#            is media/<id>.{webm,mp4} plus media/<id>_still.png
#   title    page title and diagram card title
#   short    label in the topic bar, where there is no room for the full title
#   row      `top` or `bottom` -- which band of the diagram the card sits in
#   column   1-3, left to right. With `row` this is the cell in the 3x2 grid,
#            and no two topics may claim the same cell: the rows are absolutely
#            positioned, so a collision silently stacks two cards on a busy
#            image where the eye will not catch it.
#   tint     suffix of the .skymap-card tint class -- the card's border and
#            title colour. See the tint- rules in assets/css/main.css.
#   card     ~15 words for the diagram card. Deliberately shorter than `blurb`:
#            it is set over a photograph on a translucent plate, and two
#            sentences there are unreadable.
#   blurb    one or two sentences; the topic's own summary, used in prose
#   wps      work-package tasks this topic feeds
#   papers   arXiv ids from publications.yml, for the "read more" line
#   media    OPTIONAL -- the animation, where one exists. `width`/`height` are
#            the render's real pixel size, read off the poster frame: they are
#            not all the same shape, so they reserve the right space and stop
#            the caption jumping when the video loads. `alt` describes it for
#            someone who cannot see it; `caption` says what it shows. `source`
#            is the repo and family the render came from, so it can be
#            regenerated -- see ~/code/application_plots/ANIMATIONS.md.

# ---- Top row: what GLOW builds --------------------------------------------

- id: wave-optics
  title: "Wave optics"
  short: "Wave optics"
  row: top
  column: 1
  tint: wave
  card: >-
    Diffraction and interference: the theory, and the code that computes it.
  blurb: >-
    When the wavelength is comparable to the scale of the lens, geometric optics
    fails. Diffraction, interference, plasma lensing and dispersion are all the
    same statement: the lens writes a frequency-dependent signature into the
    wave.
  wps: ["WP1-A", "WP1-B"]
  papers: ["2606.17765"]
  media:
    width: 1560
    height: 520
    alt: >-
      Animation: as the source moves closer to a point lens and crosses a
      caustic, the pattern of images changes and the amplification factor
      develops oscillations that grow with frequency.
    caption: >-
      The impact parameter falls from 2.0 to 0.1 Einstein radii and the source
      crosses a caustic mid-sweep. As the alignment tightens, the amplification
      factor acquires the oscillations that are the signature of diffraction.
    source: "GW231123_independent_analysis, family pls_y"

- id: microlensing
  title: "Microlensing"
  short: "Microlensing"
  row: top
  column: 2
  tint: strong
  card: >-
    Stars and remnants in the lensing galaxy, treated as a population rather
    than as objects.
  blurb: >-
    A lens is rarely one object. Populations of compact objects — stars,
    remnants, or dark matter — each add their own diffraction, and what a signal
    carries is the statistics of the population rather than any single lens.
  wps: ["WP1-A", "WP2-A", "WP3-A"]
  papers: ["2606.17765", "2512.17631"]
  media:
    width: 1560
    height: 520
    alt: >-
      Animation: as the magnification produced by the host galaxy is increased,
      the caustic structure around a microlens expands and the distortion it
      imprints on the signal grows.
    caption: >-
      The strength of the external potential increases, taking the macro
      magnification from 2.5 to 25. A microlens embedded in a more strongly
      magnified image distorts the signal far more, which is why the environment
      of the macroimage cannot be separated from the microlensing.
    source: "GW231123_independent_analysis, family pls_gamma"

- id: data-analysis
  title: "Data analysis"
  short: "Data analysis"
  row: top
  column: 3
  tint: methods
  card: >-
    Waveform models, population analyses, and inference fast enough to keep up.
  blurb: >-
    A lensing signature is only as good as the inference that finds it. Lensing
    enlarges the parameter space at the same time as the catalogs grow, which
    makes speed a physics problem rather than an engineering one.
  wps: ["WP2-A", "WP2-B"]
  papers: ["2512.17631", "2606.17765"]
  media:
    width: 1560
    height: 520
    alt: >-
      Animation: samples drawn from the posterior of a lensed gravitational-wave
      analysis, each one a lens configuration, with the predicted response
      converging on the best-fitting model as the samples improve.
    caption: >-
      Every draw from the posterior of the GW231123 analysis is itself a lens,
      and predicts a signal. Walking the samples from the low-likelihood tail to
      the best fit shows which combination of lens mass and shear the data
      actually constrain — the ridge in the left panel — and how the predicted
      response converges. This orders the finished posterior by likelihood: it
      is a picture of the posterior's structure, not a replay of the sampler.
    source: "GW231123_independent_analysis, family sampling"

# ---- Bottom row: what a lensed wave measures, along the light path ---------

- id: sources
  title: "Distant and strong-field sources"
  short: "Sources"
  row: bottom
  column: 1
  tint: source
  card: >-
    Magnified black holes beyond z = 3, and sources near supermassive black
    holes.
  blurb: >-
    Magnification is what makes a distant source detectable at all. It is also
    what carries a signal past a supermassive black hole, where the standard
    lensing formalism stops applying.
  wps: ["WP2-A"]
  papers: []

- id: dark-matter
  title: "Dark matter"
  short: "Dark matter"
  row: bottom
  column: 2
  tint: lens
  card: >-
    Halos and compact objects on scales no image can resolve.
  blurb: >-
    Diffraction is sensitive to structure on scales no image can resolve, which
    makes coherent sources one of the few probes of dark matter below the size
    of a galaxy.
  wps: ["WP3-A"]
  papers: ["2607.11887"]
  media:
    width: 1560
    height: 520
    alt: >-
      Animation: as the frequency rises, the Fresnel tube around the line of
      sight shrinks and the number of dark-matter halos inside it falls from
      thousands to a handful, while the resulting distortion changes character.
    caption: >-
      A frequency sweep from 0.5 mHz to 1 Hz through one realization of 2502
      dark-matter halos. The Fresnel tube shrinks as the frequency rises, so
      thousands of halos contribute at low frequency and only a few at high
      frequency — which is why a single signal probes a range of masses at once.
    source: "cdm_timbre, family stochastic_diffraction"

- id: testing-gravity
  title: "Testing gravity and dark energy"
  short: "Gravity & dark energy"
  row: bottom
  column: 3
  tint: grav
  card: >-
    Distortions along the way that no lens made of ordinary matter can produce.
  blurb: >-
    A lensed gravitational wave is a controlled experiment in how gravity
    propagates. Theories that modify it predict distortions no lens made of
    ordinary matter can produce.
  wps: ["WP3-B"]
  papers: []
  media:
    width: 1560
    height: 975
    alt: >-
      Animation: a wave passing a screened lens splits into two polarization
      eigenstates that travel at slightly different speeds, so one pulls ahead
      of the other and the waveform is scrambled.
    caption: >-
      Gravitational-wave birefringence: a screened lens gives two polarization
      eigenstates slightly different speeds, and one pulls ahead of the other.
      Over a short enough delay the two copies overlap and the waveform is
      scrambled rather than repeated.
    source: "gw_birefringence, family birefringence_scramble"
