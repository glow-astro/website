# The three work packages, as set out in the Description of Action.
#
# Schema
#   id       anchor on work-packages.html; also used by team.yml assignments
#   code     "WP1" etc., shown as the card eyebrow
#   title    short title
#   lede     one or two sentences: what the work package is for
#   tasks    the lettered tasks. Each has:
#              code     "WP1-A"
#              title    short title
#              body     what the task does. Prose, no markup.
#              outputs  optional list of concrete deliverables
#              papers   optional [{short, url}] -- the method a task builds on,
#                       rendered like the method paper of a tool on the
#                       software page
#   partners optional list of named external collaborators, as "Name (Institution)"

- id: wp1
  code: "WP1"
  title: "Wave-optics theory"
  lede: >-
    The theory and numerical methods for wave-optics lensing: diffraction by
    populations of microlenses, and lensing by ionized plasma. Everything the
    other two work packages need in order to model realistic lenses.
  tasks:
    - code: "WP1-A"
      title: "Microlensing diffraction"
      body: >-
        Quantify how populations of microlenses and the macroscopic potential of
        their host galaxy (magnification, proximity to caustics) shape a lensed
        signal. Reaching the required performance means developing new algorithms
        that can reliably tackle a large microlens population. Explore the role of
        microlens populations in astrophysical predictions.
      outputs:
        - "Public microlensing extensions of the GLoW code"
        - "Cross-validation against independent wave-optics codes"
    - code: "WP1-B"
      title: "Plasma lensing"
      body: >-
        Extend the framework to lensing by ionized matter. Plasma lensing produces
        dispersive terms by which fast radio bursts probe otherwise elusive
        baryonic matter, with applications to pulsar timing and the interstellar
        medium. Develop methods for multi-plane lensing that can account for
        deflection and dispersion at the location of the main lens, as well as the
        source's galaxy and the Milky Way.

- id: wp2
  code: "WP2"
  title: "Discovery and interpretation of lensed gravitational waves"
  lede: >-
    Turning the theory into search results. Waveform models for microlensing
    signatures, population-level analyses, and accelerated inference to keep up
    with upcoming data.
  tasks:
    - code: "WP2-A"
      title: "Microlensing searches"
      body: >-
        Search for lensing signatures in gravitational-wave data through
        microlensed waveforms. The waveform models account for stochastic
        fluctuations of the amplification and their correlation with macroscopic
        quantities (density and mass function of the lenses and the external
        potential). Develop methods to incorporate lensing signatures into a
        coherent population analysis.
      outputs:
        - "Microlensed waveform models tested against public LVK catalogs"
        - "Population model with lensing effects"
    - code: "WP2-B"
      title: "Accelerated inference"
      body: >-
        Lensing analyses multiply the parameter space, and the number of events
        is growing. Machine-learning inference, building on DINGO, makes joint
        and low-latency analyses tractable, allowing efficient inference over
        large source catalogs.
      outputs:
        - "Trained network for rapid analysis and identification of lensed signals"
      papers:
        - short: "Dax et al., arXiv:2106.12594"
          url: "https://inspirehep.net/literature/1870159"

- id: wp3
  code: "WP3"
  title: "Fundamental physics"
  lede: >-
    What lensed coherent sources reveal about the constituents of the Universe:
    the small-scale distribution of dark matter, and the impact of dark energy
    on the propagation of gravitational waves.
  tasks:
    - code: "WP3-A"
      title: "Dark-matter searches"
      body: >-
        Characterize diffraction by dark-matter objects and subhalos, and produce
        lensing constraints from available data. Connect the theory and analysis
        results to well-motivated dark-matter theories (self-interacting and
        ultra-light dark matter, dressed primordial black holes) including
        collective effects and addressing the distinguishability from stellar
        fields. Results also translate into limits on the primordial power
        spectrum.
      outputs:
        - "Lensing constraints on dark-matter objects from current data"
        - "Entries in the community repository of extended dark-matter object limits"
    - code: "WP3-B"
      title: "Gravity and dark energy"
      body: >-
        Develop the theory of gravitational-wave propagation on inhomogeneous
        space-times beyond Einstein's theory. Extract new constraints from public
        data and use them to set new limits on theories of dark energy.
      outputs:
        - "A parameterized framework for modified gravitational-wave lensing"
        - "Public likelihoods for cosmological analyses"
