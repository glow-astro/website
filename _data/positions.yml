# Positions currently advertised.
#
# ONLY open calls go in this file. What the project plans to recruit, and when,
# is not published: the shape of the team changes as the work develops, and a
# list of planned positions on a public page becomes a promise the project did
# not mean to make. Add an entry when a call actually opens; delete it when the
# call closes.
#
# Schema
#   id        anchor
#   title     what the position is about, in three or four words
#   kind      "Postdoctoral researcher" | "PhD student" | "Predoctoral fellowship"
#             -- the last for an externally funded call the project supports
#             rather than a GLOW-funded position
#   term      contract length
#   focus     optional work-package task code, when the call names one
#   profile   what the person will work on and the background it calls for
#   deadline  application deadline
#   details   optional, HTML: anything longer than a profile -- how to
#             express interest, what to send. Output as written. HTML rather
#             than Markdown because markdownify under `input: GFM` needs the
#             kramdown-parser-gfm gem, which the local build does not load
#             and nothing else on the site requires. The official call can be
#             linked here instead of through apply_url
#   apply_url where to apply
#   button    optional, a short label. When present the home page carries a
#             highlighted link to the call under the hero buttons
#
# Empty is the normal state. The Join page says so rather than showing an
# empty section.
