# People on the project.
#
# Copied from the personal site's _data/people.yml, which stays the fuller
# record: visitors, former members and earlier mentees belong there, not here.
# This file lists the people working on GLOW now.
#
# Schema
#   name      full name
#   url       optional personal or INSPIRE page
#   stage     postdoc | phd | masters -- groups the cards
#   role      "Role, Institution (relationship)". The relationship is one of
#             (co-supervised), (co-supervised with X), (close collaboration);
#             leave it off when the supervision was simply the PI's. Never the
#             possessive -- see docs/SITE_CONVENTIONS.md section 8.
#
#             "Affiliated postdoctoral researcher" means someone working on the
#             project whose salary comes from another grant. They are the same
#             rank, so they share the postdocs section rather than getting one
#             of their own; within it, order is grant-funded first and then
#             affiliated. That ordering is carried by this file alone -- the
#             template renders whatever order it finds -- so keep new entries
#             in the right half of the list.
#   location  optional, when the person is not based with the rest of the team
#   years     e.g. "2026–"
#   topic     one sentence on what the person works on
#   incoming  true -> the card shows a "starts <starts>" badge
#   starts    e.g. "October 2026"
#   wps       optional work-package task codes.
#
# TODO: `wps` is deliberately empty. Which task each person leads is a fact
# about the grant, not something to infer from a topic sentence -- fill it in
# rather than guessing, and the cards will show it.

pi:
  - name: "Miguel Zumalacárregui"
    role: "Principal Investigator"
    wps: ["WP2-A", "WP3-A"]
    url: "https://miguelzuma.github.io/"
    orcid: "0000-0002-9943-6490"
    bio: >-
      Wave optics in gravitational lensing, and what lensed gravitational waves
      reveal about the small-scale distribution of dark matter and the nature of
      gravity.

