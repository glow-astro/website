# Press and media coverage, grouped by the work being covered.
#
# The list is groups, not pieces. Coverage arrives in a burst around one result
# and then stops, so a flat reverse-chronological list of pieces buries the
# thing they are all about and repeats its title on every row. A group names the
# work once and hangs the coverage off it.
#
# GROUP
#   paper   arXiv id of the paper covered. The title, the journal and the link
#           are looked up in publications.yml, so nothing is retyped here and a
#           corrected title propagates.
#   label   for a group that is not about a paper (the grant announcement).
#           Exactly one of `paper` or `label`.
#   date    YYYY-MM-DD, the date the group is anchored to and sorted by. WHICH
#           date is a judgement per group, not a rule: preprint appearance for
#           work that was covered off the arXiv, journal publication for work
#           covered when it appeared in a journal. GW231123 below is anchored to
#           the ApJL publication (2026-08-25) because every piece followed it;
#           its preprint went up on 2025-12-01, and if coverage of the preprint
#           turns up, reconsider.
#   items   the pieces.
#
# ITEM
#   outlet  who published it, as a reader would name them.
#   title   the piece's own title, not a description of it.
#   url     absolute, rendered with rel="noopener".
#   kind    article | press release | video | podcast. Small vocabulary on
#           purpose; add a value only when an existing one would mislead.
#   lang    optional. Shown only when it is not English, because sending a
#           reader into a language they do not read wastes their click.
#   date    optional, orders items inside a group. NOT rendered: the group
#           carries the date, and a second one on every row is noise.
#
# WHAT IS NOT HERE
#
# Talks. The Cosmology Talks interview was listed here until 2026-09-04 and is
# not coverage: it is the project explaining its own work, it is already in the
# talks list on the publications page, and the outreach page links the recorded
# talks instead.

- paper: "2512.17631"
  date: 2026-08-25
  items:
    - outlet: "Science"
      title: "Extreme black hole merger may be a cosmic illusion"
      url: "https://www.science.org/content/article/extreme-black-hole-merger-may-be-cosmic-illusion"
      kind: "article"
      date: 2026-09-01

    - outlet: "Phys.org"
      title: "The biggest black hole merger ever observed could be less massive than it appears"
      url: "https://phys.org/news/2026-09-biggest-black-hole-merger-massive.html"
      kind: "article"
      date: 2026-09-03

    # The magazine's own masthead is lowercase, "bild der wissenschaft". Written
    # with capitals here at the owner's word (2026-09-04), so that it does not
    # read as a typo on a page where every other outlet is capitalized.
    - outlet: "Bild der Wissenschaft"
      title: "Rätsel um „übergewichtige“ Schwarze Löcher gelöst?"
      url: "https://wissenschaft.de/artikel/raetsel-um-uebergewichtige-schwarze-loecher-geloest"
      kind: "article"
      lang: "German"
      date: 2026-09-02

    - outlet: "Albert Einstein Institute"
      title: "Do black holes pretend to have large masses?"
      url: "https://www.aei.mpg.de/1490509/do-black-holes-pretend-to-have-large-masses"
      kind: "press release"
      date: 2026-08-26

- label: "The ERC grant"
  date: 2025-11-01
  items:
    # 9 December 2025, a month after the AEI piece: the Max Planck Society
    # announces its six Consolidator grants together. It names him and describes
    # the work but never says GLOW, so the AEI release is still the one that
    # introduces the project. Items sort newest first, which puts this one on
    # top; if that ever reads wrong, the fix is the sort in outreach.html.
    # The group itself stays anchored to November, when the grant was announced.
    - outlet: "Max Planck Society"
      title: "Six ERC Consolidator Grants for Max Planck"
      url: "https://www.mpg.de/25845263/erc-consolidator-grants-2025"
      kind: "press release"
      date: 2025-12-09

    - outlet: "Albert Einstein Institute"
      title: "ERC Consolidator Grant for Miguel Zumalacárregui"
      url: "https://www.aei.mpg.de/1359867/erc-consolidator-grant-for-miguel-zumalac-rregui"
      kind: "press release"
      date: 2025-11-01
