# Outputs related to the grant.
#
# The test for inclusion is relatedness, not the acknowledgment line: a paper
# or talk belongs here if it is part of the project's work, whether or not it
# formally acknowledges grant 101230608. Loosened by the owner on 2026-08-28,
# from a rule that turned on the acknowledgment alone -- that rule excluded
# work that plainly belongs to the project and left the judgement to a string
# in a PDF rather than to the person who knows. Unrelated work by the same
# people still belongs on their own pages, not here.
#
# papers
#   title    as published, in the paper's own spelling
#   authors  in the paper's order, "Surname" only, joined by the template
#   arxiv    bare identifier, e.g. "2512.17631"
#   url      INSPIRE record; arXiv link is built from `arxiv`
#   date     YYYY-MM-DD. What the list sorts and groups by, and therefore
#            the year shown against the paper. **Once a paper is published,
#            this is the publication date, superseding the preprint date**
#            (owner, 2026-08-28): a published paper belongs to the year it
#            appeared in the journal. Keep the preprint date in
#            `preprint_date` when it is superseded, so the record is not lost
#            and the arXiv year can still be recovered. Day is only for ties.
#   preprint_date  optional YYYY-MM-DD, set only once `date` has moved to the
#            publication date. Nothing renders it today; it is the record.
#   status   "preprint" | "accepted" | "published"
#   doi      optional, bare -- "10.3847/..." -- once the paper has one. The
#            template links it beside the arXiv id; do not include the
#            https://doi.org/ prefix, which the template adds
#   links    optional [{text, url}] for anything the paper picked up beyond the
#            preprint and the journal: a press release, coverage. Not the talk
#            about it -- talks have their own list below
#   journal  optional, only once there is one. While "accepted" it is just
#            the journal name, which the template prefixes; once "published"
#            it carries the full reference, because the template prints it bare
#   wps      work packages the paper belongs to
#   summary  one sentence: what the paper does, not how well it was received
#
#   featured whether the paper appears in "Featured articles", the annotated
#            list at the top of the page. Every paper appears in "All
#            articles" regardless. Today all of them are featured, which is
#            honest for a project with three papers: the two lists diverge as
#            the group's output grows, and that is the point of having both
#
# talks
#   Talks given by anyone on the project, not only the PI, which is why
#   `speaker` is required rather than assumed. A talk with a `url` is a
#   recording and appears in "Recorded talks" as well as in "All talks";
#   without one it appears only in "All talks".
#
#   The seminars and conference talks come from the PI's CV, which records the
#   host and the kind of talk but not, for a seminar, its title. `title` is
#   therefore optional: with one, it leads; without one, the event does.
#
#   title    optional -- the talk's own title, where there is one
#   event    the meeting, seminar series or host institution
#   location "Madrid, Spain", or "Online"
#   kind     "Colloquium", "Plenary talk", "Invited talk", "Seminar", and so on
#   invited  optional true, rendered as ", invited". Leave it off when
#            `kind` already says so ("Invited talk"), or the line reads
#            "Invited talk, invited". The CV marks these with a star
#   speaker  full name, and the reason this field exists
#   with     optional co-presenters
#   year     required, and what the list is grouped by
#   date     optional YYYY-MM-DD, for ordering within a year where it is known
#   url      optional recording. Its presence is what makes a talk "recorded"
#
#   Scope: the grant began in 2026, so this list starts in 2026. The PI has
#   given over 130 talks since 2012 and the earlier ones belong on a personal
#   page, not on the output list of this project.

papers:
  - title: "Across the Universe: GW231123 as a magnified and diffracted black hole merger"
    authors: ["Goyal", "Villarrubia-Rojo", "Zumalacárregui"]
    arxiv: "2512.17631"
    featured: true
    url: "https://inspirehep.net/arxiv/2512.17631"
    date: 2026-08-25
    preprint_date: 2025-12-01
    status: published
    journal: "The Astrophysical Journal Letters 1008, L12 (2026)"
    doi: "10.3847/2041-8213/ae93b1"
    links:
      - text: "AEI press release"
        url: "https://www.aei.mpg.de/1490509/do-black-holes-pretend-to-have-large-masses"
    wps: ["WP2-A"]
    summary: >-
      A parameter-estimation analysis of GW231123 under lensed and unlensed
      models, finding it the first compelling candidate for a magnified and
      diffracted black-hole merger. The posterior samples behind every model and
      waveform combination are public.

  - title: "Effective description of lensed gravitational waves diffracted by stellar fields"
    authors: ["Zumalacárregui", "Shan"]
    arxiv: "2606.17765"
    featured: true
    url: "https://inspirehep.net/arxiv/2606.17765"
    date: 2026-06-01
    status: preprint
    wps: ["WP1-A", "WP2-A"]
    summary: >-
      Microlensing amplification curves from simulated stellar fields are
      compressed into an orthonormal basis, with a
      distribution for its coefficients that serves as a realization-based prior.
      The basis can be used for microlensing searches in data.

  - title: "Signatures of 10–10⁴ M☉ dark-matter halos in LISA via stochastic diffraction"
    authors: ["Choi", "Urrutia", "Zumalacárregui"]
    arxiv: "2607.11887"
    featured: true
    url: "https://inspirehep.net/arxiv/2607.11887"
    date: 2026-07-01
    status: preprint
    wps: ["WP3-A"]
    summary: >-
      Many low-mass halos along the line of sight leave a collective diffraction
      imprint whose fluctuations are captured by an orthogonal basis: the "dark
      timbre". Detectability is forecast for massive black-hole binaries observed
      by LISA.

