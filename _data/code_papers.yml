# Papers that use one of the project's public codes.
#
# NOT _data/publications.yml, and the distinction is the point. That file is
# headed "Outputs related to the grant" and holds the project's own work. Most
# of what is here belongs to other people, and mixing the two would read as the
# project claiming their papers.
#
# Populated by tools/fetch_code_papers.py, which asks INSPIRE for everything
# citing the records in a tool's `inspire_seeds` (see _data/software.yml).
# Re-running it is safe: it adds and refreshes, never deletes, and never
# touches `include` or `codes`.
#
# Schema
#   arxiv    bare identifier, the key a re-run matches on. Absent for the rare
#            record with no preprint, where `url` is the key instead
#   title    as INSPIRE has it
#   authors  initial-and-surname, "et al." past three -- hi_class's shape
#   url      INSPIRE record
#   date     YYYY-MM-DD. Groups the list by year and orders it. Not displayed
#   journal  optional, once there is one
#   codes    tool ids from _data/software.yml. A LIST: one paper may use
#            several, and GLoW with a modified DINGO is a likely combination
#   include  true renders it, false hides it, null means nobody has looked yet.
#            **A citation is not a use.** Of the 74 papers citing the GLoW
#            method paper, many cite it for the physics and never ran it, and
#            nothing in INSPIRE distinguishes them: not one of those 74 names
#            GLoW in its abstract, which was checked rather than assumed. So
#            the decision is a person's, made by reading the paper.
#   note     optional, why the decision went the way it did. On a `true` it is
#            the sentence in the paper that settles it, quoted; on a `false` it
#            is there only where the paper is close enough to the line that a
#            reader would wonder.
#
# HOW THE 2026-09-03 PASS WAS MADE
#
# Every candidate with a preprint (71 of 74) was fetched from arXiv, converted
# to text, and searched for "GLoW" case-sensitively. Case matters: "GLOW" in
# capitals is the ERC grant, and it appears in the acknowledgements of the
# group's own papers, so a case-blind search marks a paper as a user of the
# code on the strength of its funding line. Each hit outside the bibliography
# was then read in context, because a code named in an introduction as prior
# art is not a code that was run: the two are one sentence apart and no
# automatic rule separates them. Of 71, 14 ran GLoW and 57 only cite it.
#
# The 3 records without a preprint (two theses and a journal-only paper) stay
# `include: null`. Nothing was read, so nothing is claimed.
