# Short, dated items for the News list on the home page.
#
#   date   YYYY-MM-DD. Only the month is displayed, so the day is just for
#          ordering within a month -- use 01 when the exact day does not matter.
#   text   one sentence, plain prose. An event, not a boast: what happened,
#          not how well it was received.
#   links  optional [{text, url}], shown after the sentence.
#
# Items newer than the freshness window (set in index.html) carry a "New" flag,
# which expires on its own at the next site build.

- date: 2025-11-01
  text: >-
    GLOW was selected for funding in the 2025 ERC Consolidator Grant call.
  links:
    - text: "ERC 2025 Consolidator results"
      url: "https://erc.europa.eu/news-events/news/erc-2025-consolidator-grants-results"
    - text: "AEI announcement"
      url: "https://www.aei.mpg.de/1359867/erc-consolidator-grant-for-miguel-zumalac-rregui"

# Dated to publication, not acceptance: ApJL 1008, L12 (2026), published
# 25 August 2026 (Crossref, DOI 10.3847/2041-8213/ae93b1). This settles the
# month that used to be guessed here from the personal site -- August was
# right, but for the wrong event.
#
# The AEI press release is embargoed until 26 August 2026. It is linked here
# from 25 August, so the site must not be made public before the embargo
# lifts. The review host is behind Access and is not public.
- date: 2026-08-25
  text: >-
    The analysis of GW231123 as a magnified and diffracted black-hole merger,
    the first compelling candidate of its kind, was published in
    The Astrophysical Journal Letters.
  links:
    - text: "arXiv:2512.17631"
      url: "https://arxiv.org/abs/2512.17631"
    - text: "AEI press release"
      url: "https://www.aei.mpg.de/1490509/do-black-holes-pretend-to-have-large-masses"
    - text: "Cosmology Talk"
      url: "https://youtu.be/ZGqOpDTL8k4"

# Dated to publication, 18 September 2026 (Crossref, DOI 10.1103/d5fx-xgd2),
# following the rule the GW231123 item set above. The AEI highlight went up on
# 21 September; it is coverage of the paper, not a second event, so it is a
# link here rather than an item of its own.
#
# "Editors' Suggestion" with the plural possessive -- APS's own wording on the
# abstract page. The AEI release writes it in the singular; the journal is the
# authority on the name of its own mark.
- date: 2026-09-18
  text: >-
    The reduced-order description of gravitational waves diffracted by stellar
    fields was published in Physical Review D as an Editors' Suggestion.
  links:
    - text: "arXiv:2606.17765"
      url: "https://arxiv.org/abs/2606.17765"
    - text: "AEI press release"
      url: "https://www.aei.mpg.de/1507473/listening-to-the-stars-beneath-the-waves"
