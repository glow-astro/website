# Short, dated items for the News list on the home page.
#
#   date   YYYY-MM-DD. Only the month is displayed, so the day is just for
#          ordering within a month -- use 01 when the exact day does not matter.
#   text   one sentence, plain prose. An event, not a boast: what happened,
#          not how well it was received.
#   links  optional [{text, url}], shown after the sentence.
#
# Items newer than the freshness window (set in index.html) carry a "New" flag,
# which expires on its own at the next site build.

# CHECK THE MONTH: dated to the acceptance. August is an assumption carried over
# from the personal site -- the preprint went out in December 2025.
- date: 2026-08-01
  text: >-
    The analysis of GW231123 as a magnified and diffracted black-hole merger,
    the first compelling candidate of its kind, was accepted in
    The Astrophysical Journal Letters.
  links:
    - text: "arXiv:2512.17631"
      url: "https://arxiv.org/abs/2512.17631"
    - text: "Cosmology Talk"
      url: "https://youtu.be/ZGqOpDTL8k4"
