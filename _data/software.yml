# Software and data products of the project.
#
# GLoW, lowercase "o", is the code. GLOW is the project. Keep them apart.
#
# Schema
#   id           short slug. The join key: _data/code_papers.yml points at a
#                tool by id, and a package page filters that file on its own.
#                Stable forever once set; the display name may change.
#   inspire_seeds  optional [INSPIRE recids]. Papers citing any of these are
#                candidates for the "papers using" list, which
#                tools/fetch_code_papers.py collects. A citation is not a use,
#                so every candidate arrives needing a human decision.
#   name, subtitle, logo, logo_alt
#   purpose      what it does, in prose
#   status       "public" | "in development" | "planned"
#   wps          work-package tasks that develop or use it
#   language     optional, one line. What someone has to be able to read
#   licence      optional, the SPDX-ish short name from the repo's LICENSE
#   repo, docs   optional URLs
#   papers       the papers to cite when the code is used, in the order the
#                code's own README asks for them. [{short, url}] plus, for the
#                package page's citation block, {title, authors, journal,
#                arxiv}. `short` is what software.html shows and is enough on
#                its own; the rest is what makes the block readable.
#   contributors optional string

tools:
  - id: "glow"
    name: "GLoW"
    subtitle: "Gravitational Lensing of Waves"
    # The method paper and the first analysis built on it. Anything citing
    # either might have used the code; nothing here assumes it did.
    inspire_seeds: [2826315, 3094475]
    logo: "/imgs/GLoW_Code_Extended_Logo_Full_Color_for_Dark_Backgrounds_RBG.png"
    logo_alt: ""
    status: public
    wps: ["WP1-A", "WP2-A", "WP3-A"]
    purpose: >-
      GLoW computes the amplification factor for gravitational waves propagating
      through a gravitational lens, in the wave-optics regime where diffraction
      and interference matter. It handles general matter distributions (built
      from a library of lenses that can be added freely) by combining
      contour-integration and time-domain methods with careful treatment of the
      singular Fermat potential. GLoW is fast enough for Bayesian parameter
      inference and to train models for simulation-based inference.
    repo: "https://github.com/glow-astro/GLoW"
    docs: "https://glow-astro.github.io/GLoW/"
    # The method paper, and only the method paper. The GW231123 analysis was
    # listed here for a while on the strength of a misreading of the README,
    # which asks for one citation and then separately lists works the code has
    # been used in. The owner confirmed on 2026-09-03 that it is not required.
    # A second methods paper is expected and belongs here when it appears.
    papers:
      - short: "Villarrubia-Rojo et al., arXiv:2409.04606"
        title: "Gravitational lensing of waves: novel methods for wave-optics phenomena"
        authors: "H. Villarrubia-Rojo, S. Savastano, M. Zumalacárregui et al."
        journal: "Phys. Rev. D 111, 103539 (2025)"
        arxiv: "2409.04606"
        url: "https://inspirehep.net/literature/2826315"
    language: "Python, with the numerical core in C behind a Cython wrapper"
    licence: "GPL-3.0"
    contributors: "Héctor Villarrubia-Rojo (lead developer), Stefano Savastano, Lyla Choi, Srashti Goyal, Liang Dai, Giovanni Tambalo, Miguel Zumalacárregui."

  - id: "dingo-lensing"
    name: "DINGO for lensed signals"
    subtitle: "Machine-learning inference"
    status: in development
    wps: ["WP2-B"]
    purpose: >-
      Simulation-based inference built on DINGO makes large-scale lensing
      analyses tractable. A model currently exists for the isolated point lens.
    papers:
      - short: "Caldarola et al., arXiv:2511.08486"
        title: "Accelerated inference of microlensed gravitational waves with machine learning"
        authors: "M. Caldarola, S. Goyal, N. Gupte et al."
        journal: "Phys. Rev. D 113, 104073 (2026)"
        arxiv: "2511.08486"
        url: "https://inspirehep.net/literature/3081783"
    contributors: "Srashti Goyal (lead developer)."
    repo: "https://github.com/dingo-gw/dingo"

# Companion code and archived data behind individual papers. Distinct from
# `tools` above: these are frozen products tied to one result, not maintained
# software.
#
# Schema
#   name     the release, as a reader would search for it
#   subtitle one line on what it is
#   paper    {short, url} -- the paper it accompanies
#   body     what the release contains, and what it does not
#   links    [{text, url}] -- repository, archive, DOI
#   doi      optional, the version DOI to cite
#
# Only list what is actually public. A repository that is still private, or a
# Zenodo deposition that is still a draft, does not go here.
releases:
  - name: "GW231123 lensing analysis"
    subtitle: "Companion code and posterior samples"
    paper:
      short: "Goyal, Villarrubia-Rojo & Zumalacárregui, arXiv:2512.17631"
      url: "https://arxiv.org/abs/2512.17631"
    body: >-
      The parameter-estimation results behind the analysis of GW231123 as a
      magnified and diffracted black-hole merger: bilby posteriors and companion
      code to reproduce the results.
    doi: "10.5281/zenodo.21725667"
    links:
      - text: "Companion code"
        url: "https://github.com/miguelzuma/GW231123_lensing_PLS"
      - text: "Posterior samples on Zenodo"
        url: "https://doi.org/10.5281/zenodo.21725667"

  - name: "Lens Stochastic Diffraction"
    subtitle: "Notebooks and forecasts"
    paper:
      short: "Zumalacárregui, arXiv:2404.17405"
      url: "https://arxiv.org/abs/2404.17405"
    body: >-
      Lens stochastic diffraction is the Poisson-distributed series of faint
      repetitions that follows a gravitational-wave event when compact objects
      along the line of sight produce additional images. The notebooks reproduce
      all the plots in the paper.
    links:
      - text: "Notebooks"
        url: "https://github.com/miguelzuma/lsd-gw-notebooks"

# Commitments about what gets released and when. These are obligations, not
# aspirations: state only what the project will actually do.
policy:
  - "Software developed by the project will be released publicly after its validation and initial scientific exploitation."
  - "Analyses are demonstrated on publicly available catalogs, so that they can be reproduced independently."
  - "Constraints on dark-matter objects are contributed to the community repository of extended-object limits."
  - "Likelihoods for gravitational-wave propagation are released in a form usable with Einstein–Boltzmann solvers."
