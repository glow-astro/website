<!DOCTYPE html>
<!--
  Revives the documentation URL printed in the published GLoW paper
  (Phys. Rev. D 111, 103539). The docs moved with the repository to
  glow-astro/GLoW, and GitHub Pages URLs are not covered by repository
  redirects, so this path 404'd.

  It lives in the user site repo, as miguelzuma.github.io/GLoW_public/, rather
  than in a repository named GLoW_public -- deliberately. Creating a repository
  under that name would take back the namespace and kill GitHub's automatic
  redirect from github.com/miguelzuma/GLoW_public, which is the *other* URL
  printed in the same paper. This way both keep working.

  No front matter, so Jekyll copies it verbatim.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>GLoW documentation has moved</title>
<link rel="canonical" href="https://glow-astro.github.io/GLoW/index.html">
<meta http-equiv="refresh" content="0; url=https://glow-astro.github.io/GLoW/index.html">
<meta name="robots" content="noindex">
<style>
  body { font: 16px/1.6 system-ui, sans-serif; max-width: 34rem; margin: 15vh auto; padding: 0 1.5rem; }
  a { color: #0645ad; }
</style>
</head>
<body>
<h1>GLoW has moved</h1>
<p>
  The documentation is now at
  <a href="https://glow-astro.github.io/GLoW/index.html">glow-astro.github.io/GLoW</a>,
  and the code at
  <a href="https://github.com/glow-astro/GLoW">github.com/glow-astro/GLoW</a>.
</p>
<p>You are being redirected. If nothing happens, follow the first link above.</p>
</body>
</html>
